 expensive XEV 9e."],["Cineluxe Edition 79 kWh","Electric","Automatic",2935000,"Cineluxe Edition trim: over Pack Three Select it adds the 79 kWh battery, a head-up display, 5-radar Level 2 ADAS with rear cross-traffic alert, fixed glass roof, walk-away lock, multi-colour ambient lighting and exclusive satin paints."],["Pack Three Select 59 kWh","Electric","Automatic",2790000,"Pack Three Select trim: over Pack Two it adds 7 airbags, a 360-degree camera, ventilated front seats, more powered driver-seat adjustment, an air purifier, gesture tailgate, blind-spot monitor and Boss mode."],["Pack Two 79 kWh","Electric","Automatic",2650000,"Same Pack Two equipment as the Pack Two 59 kWh, here with the 79 kWh battery (656 km claimed)."],["Pack Two 59 kWh","Electric","Automatic",2490000,"Pack Two trim: over Pack One it adds Level 2 ADAS with adaptive cruise control, 16-speaker Harman Kardon Dolby Atmos audio, dual-zone climate control, powered driver seat, leatherette seats, wireless charger, TPMS, auto-folding mirrors and LED fog/cornering lamps."],["Pack One 59 kWh","Electric","Automatic",2190000,"59 kWh battery with 6 airbags, ESP, hill hold and descent control, triple 12.3-inch screens with wireless Android Auto/Apple CarPlay and Alexa, automatic climate control, keyless entry, cruise control, electronic parking brake with auto hold, reverse camera, powered tailgate and bi-LED headlamps; home charger not included."]]}]},{"n":"Kia","m":[{"n":"Sonet","d":"A sub-4-metre five-seat SUV aimed at city buyers who want a well-equipped small SUV. It comes with a 1.2 petrol, a 1.0 turbo-petrol or a 1.5 diesel, and you can choose manual, clutchless iMT or automatic gearboxes.","v":[["GTX+ 1.5 Diesel 6AT","Diesel","Automatic",1435900,"Over HTX it adds Level 1 ADAS, a 360-degree camera with blind-view monitor, a 10.25-inch digital cluster with navigation screen, Bose 7-speaker audio, a 4-way power driver seat and front parking sensors."],["X-Line 1.0 Turbo Petrol 7DCT","Petrol","Automatic",1388900,"GTX+ equipment with X-Line cosmetic styling, including an exclusive matte paint option and a darker cabin theme."],["GTX+ 1.0 Turbo Petrol 7DCT","Petrol","Automatic",1374900,"Over HTX it adds Level 1 ADAS, a 360-degree camera, a full digital cluster, a navigation touchscreen, Bose audio, a power driver seat and front parking sensors."],["HTX 1.5 Diesel 6AT","Diesel","Automatic",1238900,"Over HTK+ (O) it adds a sunroof as standard, rear disc brakes, cruise control, ventilated front seats, an air purifier, paddle shifters and traction modes."],["HTK+ (O) 1.5 Diesel 6AT","Diesel","Automatic",1194900,"Over HTK+ it adds LED headlamps and fog lamps, leatherette seats, an electric sunroof, a dashcam, a rear centre armrest and a one-touch driver window."],["HTX 1.0 Turbo Petrol 7DCT","Petrol","Automatic",1183900,"HTX trim with the turbo-petrol and 7-speed DCT. It adds a sunroof, cruise control, ventilated front seats, rear disc brakes and paddle shifters over HTK+ (O)."],["HTX 1.5 Diesel 6MT","Diesel","Manual",1159900,"HTX trim with the diesel manual. It adds a sunroof, cruise control, ventilated front seats, rear disc brakes and an air purifier over HTK+ (O)."],["HTK+ 1.5 Diesel 6AT","Diesel","Automatic",1144900,"Over HTK (O) it adds a wireless phone charger, smart key with push-button start, a 60:40 split rear seat, a D-cut steering wheel and 16-inch alloy wheels."],["HTK+ (O) 1.5 Diesel 6MT","Diesel","Manual",1114900,"HTK+ (O) with the diesel manual. It adds LED headlamps, LED fog lamps, leatherette seats, a dashcam and a rear armrest over HTK+."],["HTK+ (O) 1.0 Turbo Petrol 7DCT","Petrol","Automatic",1108900,"HTK+ (O) with the turbo-petrol DCT. It adds an electric sunroof, LED headlamps and fog lamps, leatherette seats and a dashcam over HTK+."],["HTK (O) 1.5 Diesel 6AT","Diesel","Automatic",1108900,"Over HTE (O) it adds an 8-inch touchscreen with wireless Android Auto/Apple CarPlay, automatic climate control, a rear camera, auto headlamps, connected LED tail-lamps and a rear wiper."],["HTK+ 1.5 Diesel 6MT","Diesel","Manual",1064900,"HTK+ with the diesel manual. It adds a wireless charger, push-button start, a split rear seat and alloy wheels over HTK (O)."],["HTK+ (O) 1.0 Turbo Petrol iMT","Petrol","Manual",1028900,"HTK+ (O) with the turbo-petrol and clutchless iMT. It adds a sunroof, LED headlamps, leatherette seats and a dashcam over HTK+."],["HTK (O) 1.0 Turbo Petrol 7DCT","Petrol","Automatic",999900,"The cheapest turbo-petrol automatic. It adds an 8-inch touchscreen, auto AC, a rear camera and connected LED tail-lamps over HTE (O)."],["HTK (O) 1.5 Diesel 6MT","Diesel","Manual",999900,"HTK (O) with the diesel manual. It adds an 8-inch touchscreen with wireless phone mirroring, auto AC, a rear camera and a rear wiper over HTE (O)."],["HTE (O) 1.5 Diesel 6AT","Diesel","Automatic",999900,"The cheapest diesel automatic. It adds an electric sunroof, LED DRLs, rear power windows and rear sunshades over HTE."],["HTK+ (O) 1.2 Petrol 5MT","Petrol","Manual",975900,"The top trim for the 1.2 petrol. It adds LED headlamps and fog lamps, leatherette seats, a dashcam and a rear armrest over HTK+."],["HTK (O) 1.0 Turbo Petrol iMT","Petrol","Manual",933900,"The cheapest turbo-petrol, with the clutchless iMT. It adds an 8-inch touchscreen, auto AC and a rear camera over HTE (O)."],["HTE (O) 1.5 Diesel 6MT","Diesel","Manual",928900,"The cheapest diesel. It adds an electric sunroof, LED DRLs, rear power windows and sunshades over HTE."],["HTK+ 1.2 Petrol 5MT","Petrol","Manual",927900,"Over HTK (O) it adds a wireless charger, smart key with push-button start, a 60:40 split rear seat and 16-inch alloys."],["HTK (O) 1.2 Petrol 5MT","Petrol","Manual",888900,"Over HTE (O) it adds an 8-inch touchscreen with wireless Android Auto/Apple CarPlay, automatic AC, a rear camera, auto headlamps, a rear wiper and roof rails."],["HTE (O) 1.2 Petrol 5MT","Petrol","Manual",787900,"Over HTE it adds an electric sunroof, LED DRLs, rear power windows and rear sunshades."],["HTE 1.2 Petrol 5MT","Petrol","Manual",744900,"Base trim. It has 6 airbags, ESC with hill assist, a tyre pressure monitor, ISOFIX, a 4.2-inch colour cluster, electric mirrors, halogen headlamps and rear AC vents."]]},{"n":"Syros","d":"A tall, boxy sub-4-metre SUV focused on rear-seat space and comfort, with rear seats that slide and recline on higher trims. It is offered with a 1.0 turbo-petrol or a 1.5 diesel, in manual or automatic.","v":[["HTX (O) 1.5 Diesel 6AT","Diesel","Automatic",1581900,"Over HTX it adds a 12.3-inch digital cluster, a navigation touchscreen, a touch-panel climate control, rear seat ventilation, Kia Connect with OTA updates and an auto-dimming mirror."],["HTX (O) 1.0 Turbo Petrol 7DCT","Petrol","Automatic",1499900,"Top turbo-petrol trim. It adds a digital cluster, connected-car tech, rear ventilated seats and a touch climate panel over HTX."],["HTX 1.5 Diesel 6AT","Diesel","Automatic",1481900,"Over HTK+ (O) it adds a 12.3-inch touchscreen, Harman Kardon 8-speaker audio, ventilated front seats, a 4-way power driver seat, 17-inch alloys, a dual dashcam and a wireless charger."],["HTX 1.0 Turbo Petrol 7DCT","Petrol","Automatic",1401900,"HTX with the turbo DCT. It adds the larger touchscreen, Harman Kardon audio, ventilated front seats, a power driver seat and 17-inch alloys over HTK+ (O)."],["HTK+ (O) 1.5 Diesel 6AT","Diesel","Automatic",1401900,"Over HTK+ it adds leatherette seats, push-button start, a rear wiper and washer, and remote window operation via the key."],["HTK+ (O) 1.0 Turbo Petrol 7DCT","Petrol","Automatic",1321900,"HTK+ (O) with the turbo DCT. It adds leatherette upholstery, a rear wiper and key-operated windows over HTK+."],["HTK+ (O) 1.5 Diesel 6MT","Diesel","Manual",1281900,"HTK+ (O) with the diesel manual. It adds leatherette seats, push-button start and a rear wiper over HTK+."],["HTK+ 1.5 Diesel 6AT","Diesel","Automatic",1275900,"Over HTK (EX) it adds a dual-pane panoramic sunroof, sliding and reclining 60:40 rear seats, cruise control and a rear defogger. The automatic also gets an electric parking brake, paddle shifters and drive modes."],["HTK+ (O) 1.0 Turbo Petrol 6MT","Petrol","Manual",1201900,"HTK+ (O) with the turbo-petrol manual. It adds leatherette seats, push-button start and a rear wiper over HTK+."],["HTK+ 1.0 Turbo Petrol 7DCT","Petrol","Automatic",1195900,"The cheapest Syros automatic. It adds a panoramic sunroof, sliding rear seats, cruise control, an electric parking brake and paddle shifters over HTK (EX)."],["HTK+ 1.5 Diesel 6MT","Diesel","Manual",1155900,"HTK+ with the diesel manual. It adds a panoramic sunroof, sliding and reclining rear seats, and cruise control over HTK (EX)."],["HTK+ 1.0 Turbo Petrol 6MT","Petrol","Manual",1075900,"HTK+ with the turbo-petrol manual. It adds a panoramic sunroof, sliding and reclining rear seats, and cruise control over HTK (EX)."],["HTK (EX) 1.5 Diesel 6MT","Diesel","Manual",1061900,"Over HTE (O) it adds LED headlamps, LED DRLs and tail-lamps, auto-folding mirrors, a rear camera, roof rails and auto headlamps."],["HTE (O) 1.5 Diesel 6MT","Diesel","Manual",999900,"The cheapest diesel. It adds an electric sunroof, 16-inch alloys, tweeters, driver seat height adjustment and TPMS over HTE."],["HTK (EX) 1.0 Turbo Petrol 6MT","Petrol","Manual",981900,"Over HTE (O) it adds LED headlamps and tail-lamps, auto-fold mirrors, a rear camera and roof rails."],["HTE (O) 1.0 Turbo Petrol 6MT","Petrol","Manual",921900,"Over HTE it adds an electric sunroof, 16-inch alloy wheels, tweeters, driver seat height adjustment and a tyre pressure monitor."],["HTE 1.0 Turbo Petrol 6MT","Petrol","Manual",841900,"Base trim. It has a 10.25-inch touchscreen with wireless Android Auto/Apple CarPlay, a 12-inch LCD cluster, a 20-feature safety pack, LED fog lamps, rear AC vents, sunshades and keyless entry."]]},{"n":"Carens","d":"A value-focused seven-seat MPV, now sold in a single Premium (O) trim for families who need three rows on a budget. It comes with petrol, factory CNG or diesel, all with a 6-speed manual.","v":[["Premium (O) 1.5 Diesel 6MT","Diesel","Manual",1297900,"Same Premium (O) equipment with the 1.5 diesel engine, the most frugal choice for high-mileage users."],["Premium (O) 1.5 Petrol CNG 6MT","CNG","Manual",1211800,"Premium (O) equipment with a factory-fitted CNG kit on the 1.5 petrol for lower running costs."],["Premium (O) 1.5 Petrol 6MT","Petrol","Manual",1111900,"Entry variant. It has 6 airbags, ESC, all-wheel disc brakes, TPMS, rear parking sensors, an 8-inch touchscreen with Android Auto/Apple CarPlay, one-touch tumble second row, roof AC vents and 5 USB-C ports."]]},{"n":"Seltos","d":"The second-generation Seltos is a five-seat midsize SUV for families who want lots of features and a choice of powertrains. It offers a 1.5 petrol (manual/IVT), a 1.5 turbo-petrol (DCT) and a 1.5 diesel (manual/AT), with Level 2 ADAS on upper trims.","v":[["GTX (O) 1.5 Diesel 6AT","Diesel","Automatic",2181900,"Top trim. Over GTX (A) it upgrades to Level 2+ ADAS with 28 functions."],["X-Line (O) 1.5 Diesel 6AT","Diesel","Automatic",2181900,"GTX (O) equipment with X-Line styling: black alloys, black and hunter-green interior and an exclusive matte paint option."],["GTX (O) 1.5 Turbo Petrol 7DCT","Petrol","Automatic",2156900,"Top turbo-petrol trim. It upgrades GTX (A) to Level 2+ ADAS with 28 functions."],["X-Line (O) 1.5 Turbo Petrol 7DCT","Petrol","Automatic",2156900,"GTX (O) turbo with X-Line black alloys, a green-accented cabin and a matte paint option."],["GTX (A) 1.5 Diesel 6AT","Diesel","Automatic",2032400,"Over GTX it adds Level 2 ADAS (21 functions), the Trinity panoramic display with a 12.3-inch digital cluster, and side parking sensors."],["X-Line (A) 1.5 Diesel 6AT","Diesel","Automatic",2032400,"GTX (A) diesel with X-Line black alloys, a black and hunter-green interior and a matte paint option."],["GTX (A) 1.5 Turbo Petrol 7DCT","Petrol","Automatic",1999900,"GTX turbo with Level 2 ADAS, the panoramic display with digital cluster, and side parking sensors added."],["X-Line (A) 1.5 Turbo Petrol 7DCT","Petrol","Automatic",1999900,"GTX (A) turbo with X-Line cosmetic styling: black wheels, a green-accented cabin and a matte paint option."],["GTX 1.5 Diesel 6AT","Diesel","Automatic",1999900,"Over HTX it adds LED projector headlamps, 18-inch alloys, a black-and-white sporty cabin, a 10-way power driver seat with memory and auto-dipping mirrors. ADAS is not included."],["HTX (A) 1.5 Diesel 6AT","Diesel","Automatic",1993900,"Over HTX it adds Level 2 ADAS (21 functions), the Trinity panoramic display with a 12.3-inch digital cluster, and side parking sensors."],["GTX (A) 1.5 Petrol IVT","Petrol","Automatic",1981900,"The best-equipped non-turbo petrol. It is GTX with Level 2 ADAS, the panoramic display and side parking sensors."],["X-Line (A) 1.5 Petrol IVT","Petrol","Automatic",1981900,"GTX (A) IVT with X-Line black alloys, a green-accented interior and a matte paint option."],["GTX 1.5 Turbo Petrol 7DCT","Petrol","Automatic",1951900,"Sporty GTX trim with the turbo DCT. Over HTX it adds projector LED headlamps, 18-inch alloys, a memory power driver seat and a black-and-white cabin."],["HTX (A) 1.5 Turbo Petrol 7DCT","Petrol","Automatic",1911900,"HTX turbo with Level 2 ADAS, a 12.3-inch digital cluster in the panoramic display, and side parking sensors added."],["HTX 1.5 Diesel 6AT","Diesel","Automatic",1883900,"Over HTK (O) it adds a 12.3-inch touchscreen, Bose 8-speaker audio, dual-zone climate control, ambient lighting, LED fog lamps and Kia Connect with OTA updates."],["GTX 1.5 Petrol IVT","Petrol","Automatic",1871900,"GTX styling and comfort with the non-turbo petrol IVT: projector LEDs, 18-inch alloys and a memory power driver seat over HTX."],["HTX (A) 1.5 Diesel 6MT","Diesel","Manual",1863900,"The only manual with ADAS. It adds Level 2 ADAS, a digital cluster and side parking sensors over the HTX diesel manual."],["HTX (A) 1.5 Petrol IVT","Petrol","Automatic",1831900,"HTX petrol IVT with Level 2 ADAS, the panoramic display and side parking sensors added."],["HTX 1.5 Turbo Petrol 7DCT","Petrol","Automatic",1801900,"HTX trim with the turbo-petrol DCT. It adds the 12.3-inch screen, Bose audio, dual-zone AC and ambient lighting over HTK (O)."],["HTX 1.5 Diesel 6MT","Diesel","Manual",1753900,"HTX diesel manual. It adds a larger touchscreen, Bose sound, dual-zone climate control, ventilated seats and connected tech over HTK (O)."],["HTK (O) 1.5 Diesel 6AT","Diesel","Automatic",1743900,"Over HTK it adds a dual-pane panoramic sunroof, leatherette seats, a wireless charger and a leather-wrapped wheel. Automatics also get ventilated front seats and an 8-way power driver seat."],["HTX 1.5 Petrol IVT","Petrol","Automatic",1721900,"HTX with the petrol IVT. It adds a 12.3-inch touchscreen, Bose 8-speaker audio, dual-zone AC and ambient lighting over HTK (O)."],["HTX (A) 1.5 Petrol 6MT","Petrol","Manual",1701900,"The cheapest Seltos with Level 2 ADAS. It adds ADAS, a 12.3-inch digital cluster and side sensors over the HTX petrol manual."],["HTK (O) 1.5 Turbo Petrol 7DCT","Petrol","Automatic",1661900,"The entry turbo-petrol. It adds a panoramic sunroof, leatherette seats, ventilated front seats and a power driver seat over HTK."],["HTK 1.5 Diesel 6AT","Diesel","Automatic",1633900,"Over HTE (O) it adds 17-inch alloys, auto-fold mirrors, smart key with push-button start, a rear defogger, rear sunshades and a tilt/telescopic wheel."],["HTK (O) 1.5 Diesel 6MT","Diesel","Manual",1613900,"HTK (O) diesel manual. It adds a panoramic sunroof, leatherette seats and a wireless charger over HTK."],["HTX 1.5 Petrol 6MT","Petrol","Manual",1591900,"The cheapest HTX. It adds a 12.3-inch touchscreen, Bose audio, dual-zone AC, ventilated front seats and LED fog lamps over HTK (O)."],["HTK (O) 1.5 Petrol IVT","Petrol","Automatic",1581900,"HTK (O) with the petrol IVT. It adds a panoramic sunroof, leatherette seats, ventilated front seats and a power driver seat over HTK."],["HTE (O) 1.5 Diesel 6AT","Diesel","Automatic",1532400,"The cheapest diesel automatic. Over HTE it adds an electric parking brake with auto hold, drive and traction modes, paddle shifters and a split reclining rear seat."],["HTK 1.5 Diesel 6MT","Diesel","Manual",1503900,"HTK diesel manual. It adds alloys, push-button start, auto-fold mirrors, a rear defogger and sunshades over HTE (O)."],["HTK 1.5 Petrol IVT","Petrol","Automatic",1471900,"HTK with the petrol IVT. It adds 17-inch alloys, smart key, auto-fold mirrors and a tilt/telescopic wheel over HTE (O)."],["HTK (O) 1.5 Petrol 6MT","Petrol","Manual",1451900,"The cheapest Seltos with a panoramic sunroof. It also adds leatherette seats and a wireless charger over HTK."],["HTE (O) 1.5 Diesel 6MT","Diesel","Manual",1403900,"Over HTE it adds connected LED tail-lamps, roof rails, semi-leatherette seats and a 60:40 reclining rear seat with armrest."],["HTE (O) 1.5 Petrol IVT","Petrol","Automatic",1371900,"The cheapest Seltos automatic. It adds an electric parking brake, drive and traction modes, paddle shifters and a split rear seat over HTE."],["HTK 1.5 Petrol 6MT","Petrol","Manual",1341900,"Over HTE (O) it adds smart key with push-button start, auto-fold mirrors, a rear defogger, rear sunshades and a tilt/telescopic wheel. It keeps 16-inch styled steel wheels."],["HTE 1.5 Diesel 6MT","Diesel","Manual",1293900,"The cheapest diesel. It has the same HTE kit as the petrol (LED lamps, 10.25-inch touchscreen, rear camera, cruise control) with the 1.5 diesel manual."],["HTE (O) 1.5 Petrol 6MT","Petrol","Manual",1241900,"Over HTE it adds connected LED tail-lamps, roof rails, semi-leatherette seats and a 60:40 reclining rear seat with armrest."],["HTE 1.5 Petrol 6MT","Petrol","Manual",1124900,"Base trim. It has LED headlamps and DRLs, 16-inch steel wheels, a 10.25-inch touchscreen with wireless Android Auto/Apple CarPlay, a 12-inch LCD cluster, a rear camera, cruise control and rear AC vents."]]},{"n":"Carens Clavis","d":"A more upmarket seven-seat MPV than the Carens, with a modern cabin, a panoramic sunroof and ADAS on higher trims. It is offered with petrol, turbo-petrol, CNG and diesel, in manual, iMT, DCT and torque-converter automatic.","v":[["X-Line 1.5 Turbo Petrol 7DCT","Petrol","Automatic",2178900,"GTX+ equipment with X-Line styling: black leatherette with hunter-green accents and different 17-inch alloys."],["GTX+ 1.5 Turbo Petrol 7DCT","Petrol","Automatic",2178900,"Over HTX+ it adds a sporty black interior with off-white accents, lime brake calipers, a dual-camera dashcam, seatback tables and paddle shifters."],["HTX+ 1.5 Turbo Petrol 7DCT","Petrol","Automatic",2106900,"Over HTX (O) it adds Level 2 ADAS (20 functions), ventilated front seats, rain-sensing wipers, a panoramic sunroof, a walk-in lever and paddle shifters."],["GTX 1.5 Turbo Petrol 7DCT","Petrol","Automatic",1999900,"A sporty take on HTX. It adds black leatherette with off-white accents, 17-inch alloys with lime calipers and a dual-pane panoramic sunroof."],["HTX (O) 1.5 Turbo Petrol 7DCT","Petrol","Automatic",1961900,"Over HTX it adds 17-inch dual-tone alloys and Bose 8-speaker audio. It is available only with the turbo DCT."],["HTX+ 1.5 Turbo Petrol iMT","Petrol","Manual",1932900,"HTX+ with the clutchless iMT. It adds ventilated front seats, rain-sensing wipers, a panoramic sunroof and a dashcam (no ADAS)."],["HTX+ 1.5 Turbo Petrol 6MT","Petrol","Manual",1903900,"HTX+ with the turbo manual. It has ventilated seats, a panoramic sunroof, rain-sensing wipers and Bose audio; ADAS is not offered with the manual."],["HTX 1.5 Diesel 6MT","Diesel","Manual",1900900,"Over HTK+ (O) it adds a 12.25-inch touchscreen and 12.25-inch digital cluster, a 360-degree camera, leatherette seats, connected tech with OTA, an air purifier, ambient lighting and seatback tables."],["HTK+ (O) 1.5 Turbo Petrol 7DCT","Petrol","Automatic",1785900,"Over HTK+ it adds LED headlamps and connected DRLs, 17-inch alloys, a wireless charger, a rear wiper and defogger, auto-fold mirrors, a dashcam and a panoramic sunroof."],["HTK+ 1.5 Diesel 6AT","Diesel","Automatic",1756900,"The cheapest diesel automatic. Over HTE (EX) it adds a 12.5-inch LCD cluster, an 8-inch touchscreen, connected tail-lamps, front sensors, cruise control and push-button start."],["HTK+ (O) 1.5 Diesel 6MT","Diesel","Manual",1721900,"HTK+ (O) diesel manual. It adds LED headlamps, 17-inch alloys, a wireless charger, a rear wiper and a dashcam over HTK+; it has a single-pane sunroof."],["HTK+ 1.5 Turbo Petrol 7DCT","Petrol","Automatic",1684900,"The cheapest Clavis automatic. It adds a digital LCD cluster, an 8-inch touchscreen, cruise control, push-button start with remote start, drive modes and a sunroof over HTE (EX)."],["HTK+ 1.5 Diesel 6MT","Diesel","Manual",1643900,"HTK+ diesel manual. It adds an 8-inch touchscreen, LCD cluster, front parking sensors, cruise control, push-button start and a sunroof over HTE (EX)."],["HTK+ (O) 1.5 Turbo Petrol 6MT","Petrol","Manual",1641900,"HTK+ (O) turbo manual. It adds LED headlamps, 17-inch alloys, a panoramic sunroof, a wireless charger and a dashcam over HTK+."],["HTE (EX) 1.5 Diesel 6MT","Diesel","Manual",1487900,"Over HTE (O) it adds a skylight electric sunroof, LED DRLs and fully automatic climate control."],["HTE (O) 1.5 Diesel 6MT","Diesel","Manual",1436900,"The cheapest diesel. Over HTE it adds an 8-inch touchscreen with Android Auto/Apple CarPlay, a 12.5-inch LCD cluster and electric mirrors with LED indicators."],["HTE (EX) 1.5 Turbo Petrol 6MT","Petrol","Manual",1376900,"HTE (EX) turbo-petrol. It adds a sunroof, LED DRLs and automatic climate control over HTE (O)."],["HTE (O) 1.5 Petrol CNG 6MT","CNG","Manual",1334800,"Factory CNG version of HTE (O). It adds the 8-inch touchscreen and LCD cluster over the HTE CNG."],["HTE (O) 1.5 Turbo Petrol 6MT","Petrol","Manual",1321900,"The cheapest turbo-petrol. It adds an 8-inch touchscreen, LCD cluster and electric mirrors with LED indicators over HTE."],["HTE (EX) 1.5 Petrol 6MT","Petrol","Manual",1285900,"Over HTE (O) it adds a skylight sunroof, LED DRLs and fully automatic AC."],["HTE 1.5 Petrol CNG 6MT","CNG","Manual",1238800,"Base trim with a factory CNG kit on 16-inch steel wheels. It has the same safety pack and seating flexibility as the petrol HTE."],["HTE (O) 1.5 Petrol 6MT","Petrol","Manual",1234900,"Over HTE it adds an 8-inch touchscreen with Android Auto/Apple CarPlay, a 12.5-inch LCD cluster and electric mirrors with LED indicators."],["HTE 1.5 Petrol 6MT","Petrol","Manual",1138900,"Base trim. It has an 18-feature safety pack with 6 airbags, one-touch electric tumble for the second row, roof AC vents for rows 2 and 3, 5 USB-C ports, keyless entry and 15-inch alloys."]]},{"n":"Syros EV","d":"An all-electric version of the Syros compact SUV for city and intercity commuting. It has a 42 kWh or 51.4 kWh battery (up to 526 km claimed), a front trunk and higher-trim features such as V2L and ADAS.","v":[["X-Line ER","Electric","Automatic",1999900,"Over HTX+ ER it adds Level 2 ADAS, a 360-degree camera with blind-view monitor, a digital key, interior V2L, ambient lighting and side parking sensors."],["HTX+ ER","Electric","Automatic",1949900,"Over HTX ER it adds ventilated seats in both rows, leatherette trim, Harman Kardon 8-speaker audio, navigation, a power driver seat, a wireless charger, a dashcam and front sensors."],["HTX ER","Electric","Automatic",1799900,"Over HTK+ ER it adds a panoramic sunroof, sliding and reclining split rear seats, Kia Connect with OTA, one-touch windows on all doors, a rear wiper and a defogger."],["HTK+ ER","Electric","Automatic",1699900,"The cheapest Extended Range variant: the 51.4 kWh battery and 17-inch aero alloys on HTK+ equipment."],["HTX","Electric","Automatic",1599900,"Over HTK+ it adds a panoramic sunroof, sliding and reclining 60:40 rear seats, one-touch windows, a rear wiper and a defogger, with the 42 kWh battery."],["HTK+","Electric","Automatic",1499900,"Over HTK it adds cruise control, a rear camera with guidelines and a 100 W USB-C charger."],["HTK","Electric","Automatic",1349900,"Base 42 kWh variant. It has twin 12.3-inch screens, automatic climate control, 16-inch aero alloys, LED lamps, all-wheel disc brakes, an electric parking brake, regen paddles and a frunk."]]},{"n":"Carens Clavis EV","d":"An electric three-row MPV for families who want zero-emission running with six or seven seats. It comes with a 42 kWh (404 km claimed) or 51.4 kWh (490 km claimed) battery.","v":[["X-Line ER 6-Seater","Electric","Automatic",2499900,"Six-seat version with second-row captain seats; same price and equipment as the X-Line ER 7-seater."],["X-Line ER 7-Seater","Electric","Automatic",2499900,"GTX+ ER equipment with X-Line black alloys and a black interior with hunter-green accents."],["GTX+ ER 6-Seater","Electric","Automatic",2499900,"Six-seat version of GTX+ ER with captain seats; same price as the 7-seater."],["GTX+ ER 7-Seater","Electric","Automatic",2499900,"Over HTX+ ER it adds a sporty black and off-white interior, lime brake calipers, a battery heater and a digital key."],["HTX+ ER 6-Seater","Electric","Automatic",2453900,"Six-seat version of HTX+ ER with second-row captain seats; same price as the 7-seater."],["HTX+ ER 7-Seater","Electric","Automatic",2453900,"Over GTX ER it adds Bose 8-speaker audio, V2L, ventilated front seats, a 4-way power driver seat, rain-sensing wipers, a walk-in lever and logo puddle lamps."],["GTX ER 6-Seater","Electric","Automatic",2303900,"Six-seat version of GTX ER with captain seats; same price as the 7-seater."],["GTX ER 7-Seater","Electric","Automatic",2303900,"A sporty version of HTX ER with black leatherette and off-white accents, lime brake calipers and a 3-spoke steering wheel."],["HTX ER 6-Seater","Electric","Automatic",2253900,"Six-seat version of HTX ER with captain seats; same price as the 7-seater."],["HTX ER 7-Seater","Electric","Automatic",2253900,"HTX with the 5  Line dark styling pack."],["HTX (A) 1.6 Turbo Hybrid AT AWD 7-Seater","Hybrid","Automatic",3999000,"Over HTX it adds Level 2 ADAS with 30 functions."],["HTX Black Line 1.6 Turbo Hybrid AT AWD 6-Seater","Hybrid","Automatic",3939000,"HTX hybrid 6-seater with the Black Line styling pack."],["HTX 1.6 Turbo Hybrid AT AWD 6-Seater","Hybrid","Automatic",3919000,"Six-seat version of HTX hybrid with second-row captain seats."],["HTX Black Line 1.6 Turbo Hybrid AT AWD 7-Seater","Hybrid","Automatic",3919000,"HTX hybrid 7-seater with the Black Line styling pack."],["HTX 1.6 Turbo Hybrid AT AWD 7-Seater","Hybrid","Automatic",3899000,"Over HTK (A) it adds AWD with terrain modes, 10 airbags, a head-up display, memory relaxation front seats, ventilated second-row seats, a digital key, a dashcam, remote parking assist and a digital IRVM. Level 2 ADAS is not included; it comes with HTX (A)."],["HTX (A) Black Line 2.2 Diesel DCT AWD 6-Seater","Diesel","Automatic",3889000,"Top diesel. It adds the Black Line dark styling pack to the HTX (A) diesel 6-seater."],["HTX (A) 2.2 Diesel DCT AWD 6-Seater","Diesel","Automatic",3869000,"Six-seat version of HTX (A) diesel with captain seats."],["HTX (A) Black Line 2.2 Diesel DCT AWD 7-Seater","Diesel","Automatic",3869000,"HTX (A) diesel 7-seater with the Black Line styling pack."],["HTX (A) 2.2 Diesel DCT AWD 7-Seater","Diesel","Automatic",3849000,"Over HTX diesel it adds Level 2 ADAS with 30 functions."],["HTX Black Line 2.2 Diesel DCT AWD 6-Seater","Diesel","Automatic",3789000,"HTX diesel 6-seater with the Black Line styling pack."],["HTX Black Line 2.2 Diesel DCT AWD 7-Seater","Diesel","Automatic",3769000,"HTX diesel 7-seater with the Black Line styling pack."],["HTX 2.2 Diesel DCT AWD 6-Seater","Diesel","Automatic",3769000,"Six-seat version of HTX diesel with captain seats."],["HTX 2.2 Diesel DCT AWD 7-Seater","Diesel","Automatic",3749000,"Over HTK (A) diesel it adds AWD with terrain modes, 10 airbags, HUD, memory relaxation front seats, vent  powertrain."],["HTE 1.6 Turbo Hybrid AT 7-Seater","Hybrid","Automatic",2949000,"The cheapest hybrid: HTE equipment with the 1.6 turbo-petrol hybrid (Kia claims up to 19.6 km/l), plus paddle shifters and a dial-type shifter."],["HTE (O) 2.2 Diesel DCT 7-Seater","Diesel","Automatic",2949000,"Over HTE it adds a smart power tailgate, a panoramic sunroof, 3-step ventilated front seats and an 8-way power passenger seat."],["HTE 2.2 Diesel DCT 7-Seater","Diesel","Automatic",2799000,"Base variant. It has a 26-feature safety pack with 7 airbags, a 12.3-inch touchscreen with Android Auto/Apple CarPlay, a wireless charger, a 10-way power driver seat, 8 parking sensors, 18-inch alloys and power-folding mirrors."]]}]},{"n":"Toyota","m":[{"n":"Glanza","d":"Premium five-seat hatchback, related to the Maruti Baleno, that suits city families and first-time buyers. Offers a 1.2L petrol with manual or AMT plus factory CNG, six airbags as standard and Level 2 ADAS on the top trim.","v":[["V(O) AMT","Petrol","Automatic",1098000,"Same equipment as the V(O) MT, with a 5-speed AMT."],["V AMT","Petrol","Automatic",1059000,"Same equipment as the V MT, with a 5-speed AMT."],["V(O) MT","Petrol","Manual",1049000,"Adds Level 2 ADAS over the V MT: adaptive cruise control, autonomous emergency braking, lane keep assist and auto high beam."],["G AMT CNG","CNG","Automatic",1023000,"Same as the G MT CNG, with a 5-speed AMT."],["V MT","Petrol","Manual",999000,"Over the G MT adds 360-degree camera, head-up display, ventilated front seats, leatherette seats, leather steering wheel, LED fog lamps, cruise control, auto-dimming mirror and Clarion audio."],["G MT CNG","CNG","Manual",968000,"G-trim equipment with a factory-fitted CNG kit (claimed 33.61 km/kg)."],["G AMT","Petrol","Automatic",933000,"Same equipment as the G MT, with a 5-speed AMT."],["S AMT CNG","CNG","Automatic",931000,"Same as the S MT CNG, with a 5-speed AMT."],["S MT CNG","CNG","Manual",876000,"S-trim equipment with a factory-fitted CNG ear AC and split-folding second and third rows."]]},{"n":"Urban Cruiser Hyryder","d":"Mid-size five-seat SUV for families wanting low running costs, offered with mild-hybrid petrol, CNG or a strong-hybrid powertrain. Upper trims add a panoramic sunroof, ventilated seats and 360-degree camera.","v":[["V e-Drive 2WD Hybrid","Hybrid","Automatic",1999000,"Over the G(O) Hybrid adds 360-degree camera, head-up display, powered driver seat and extra dashboard ambient lighting."],["G(O) e-Drive 2WD Hybrid","Hybrid","Automatic",1924000,"Over the S Hybrid adds LED headlamps, 17-inch alloys, 9-inch touchscreen, panoramic sunroof, ventilated front seats, wireless charger and premium audio."],["V AT 2WD Neo Drive","Petrol","Automatic",1767000,"Same equipment as the V MT, with a 6-speed automatic and paddle shifters."],["S e-Drive 2WD Hybrid","Hybrid","Automatic",1718000,"S-trim equipment with the 1.5L self-charging strong-hybrid (116 PS system output) and e-CVT, capable of EV-mode driving."],["V MT 2WD Neo Drive","Petrol","Manual",1642000,"Over the G(O) MT adds 360-degree camera, head-up display, powered driver seat and optional dual-tone paint."],["G(O) AT 2WD Neo Drive","Petrol","Automatic",1618000,"Same equipment as the G(O) MT, with a 6-speed automatic and paddle shifters."],["G MT 2WD CNG","CNG","Manual",1572000,"Over the S CNG adds LED headlamps, alloy wheels, 9-inch touchscreen, ventilated front seats, wireless charger and auto-folding mirrors."],["G(O) MT 2WD Neo Drive","Petrol","Manual",1487000,"Over the S MT adds LED headlamps, 17-inch alloys, 9-inch touchscreen, 7-inch driver display, panoramic sunroof, ventilated front seats and wireless charger."],["S AT 2WD Neo Drive","Petrol","Automatic",1417000,"Same equipment as the S MT, with a 6-speed automatic and paddle shifters."],["S MT 2WD CNG","CNG","Manual",1371000,"S-trim equipment with a factory-fitted CNG kit."],["S MT 2WD Neo Drive","Petrol","Manual",1282000,"Base trim: 1.5L mild-hybrid petrol manual, six airbags, ES
